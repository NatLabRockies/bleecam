# Read the Docs build configuration for BLEECAM.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    # Documentation toolchain (Sphinx, MyST, theme).
    - requirements: docs/requirements.txt
    # Install BLEECAM itself so autodoc can import the real modules.
    # Heavy/optional libs are mocked in conf.py, so the core install is enough.
    - method: pip
      path: .

formats:
  - pdf
  - htmlzip
